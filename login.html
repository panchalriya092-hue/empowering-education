<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Empowering Education</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Common JS -->
    <script src="common.js" defer></script>

    <!-- Login JS -->
    <script src="login.js" defer></script>
</head>

<body>

    <!-- LOGIN BG -->
    <div class="auth-bg d-flex align-items-center justify-content-center">

        <!-- LOGIN CARD -->
        <div class="login-card p-4 p-md-5">

            <div class="text-center mb-4">
                <i class="fa-solid fa-user-graduate fa-3x text-primary mb-2"></i>
                <h4 class="fw-bold">Welcome Back</h4>
                <p class="text-muted">Login to continue</p>
            </div>

            <form id="loginForm" novalidate>

                <!-- Email -->
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email"
                           id="email"
                           class="form-control"
                           placeholder="Enter email"
                           required>
                </div>

                <!-- Password -->
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password"
                           id="password"
                           class="form-control"
                           placeholder="Enter password"
                           required>
                </div>

                <!-- Forgot -->
                <div class="text-end mb-3">
                    <a href="#" class="small text-decoration-none">
                        Forgot password?
                    </a>
                </div>

                <!-- Button -->
                <button type="submit" class="btn btn-primary w-100 py-2">
                    Login
                </button>

                <!-- Register -->
                <p class="text-center mt-3">
                    Don't have an account?
                    <a href="register.html" class="fw-bold text-decoration-none">
                        Register
                    </a>
                </p>

            </form>
        </div>
    </div>

    <!-- Home Icon -->
    <a href="index.html" class="home-btn">
        <i class="fa-solid fa-house"></i>
    </a>

</body>
</html>
