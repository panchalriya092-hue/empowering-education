<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register | Empowering Education</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Common JS -->
    <script src="common.js"></script>

    <!-- Register JS -->
    <script src="register.js" defer></script>
</head>

<body>

    <!-- REGISTER BACKGROUND -->
    <div class="auth-bg d-flex justify-content-center align-items-center">

        <!-- REGISTER CARD -->
        <div class="login-card p-4 p-md-5">

            <div class="text-center mb-4">
                <i class="fa-solid fa-user-plus fa-3x text-success mb-2"></i>
                <h4 class="fw-bold">Create Account</h4>
                <p class="text-muted">Join our community</p>
            </div>

            <!-- FORM -->
            <form id="registerForm" novalidate>

                <!-- Full Name -->
                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text"
                           id="name"
                           class="form-control"
                           placeholder="Enter your name"
                           required>
                </div>

                <!-- Email -->
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email"
                           id="regEmail"
                           class="form-control"
                           placeholder="Enter email"
                           required>
                </div>

                <!-- Password -->
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password"
                           id="regPassword"
                           class="form-control"
                           placeholder="Create password"
                           required>
                </div>

                <!-- Confirm Password -->
                <div class="mb-3">
                    <label class="form-label">Confirm Password</label>
                    <input type="password"
                           id="confirmPassword"
                           class="form-control"
                           placeholder="Confirm password"
                           required>
                </div>

                <!-- Register Button -->
                <button type="submit" class="btn btn-success w-100 py-2">
                    Register
                </button>

                <!-- Login Link -->
                <p class="text-center mt-3">
                    Already have an account?
                    <a href="login.html" class="fw-bold text-decoration-none">
                        Login
                    </a>
                </p>

            </form>

        </div>
    </div>

    <!-- Home Button -->
    <a href="index.html" class="home-btn">
        <i class="fa-solid fa-house"></i>
    </a>

</body>
</html>
